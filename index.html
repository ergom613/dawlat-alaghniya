<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>دولة الأغنياء — State of the Rich</title>
  <style>
    :root {
      --bg: rgba(16, 14, 12, 0.62);
      --bg2: rgba(22, 18, 14, 0.78);
      --line: rgba(232, 196, 90, 0.5);
      --gold: #e8c45a;
      --text: #fff6df;
      --muted: #c9b896;
      --btn: rgba(255,255,255,0.10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec7e8; font-family: "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, "Segoe UI", sans-serif; color: var(--text); }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #hud * { pointer-events: auto; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .name-tag {
      position: absolute; left: 0; top: 0;
      transform: translate(-50%, -100%);
      background: rgba(20,18,14,0.88);
      border: 1px solid rgba(232,196,90,0.95);
      color: #fff6df;
      border-radius: 7px;
      padding: 1px 5px 1px;
      font-weight: 700;
      font-size: 8px;
      line-height: 1.2;
      white-space: nowrap;
      text-shadow: 0 1px 1px rgba(0,0,0,0.45);
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      will-change: transform;
    }
    .name-tag strong { display: block; font-weight: 800; letter-spacing: 0; }
    .name-tag small { display: block; color: #e8c45a; font-weight: 600; font-size: 7px; margin-top: 0; }
    .name-tag.yacht { font-size: 8px; padding: 1px 5px; border-radius: 7px; }
    .name-tag.caption { transform: translate(-50%, 12%); font-size: 14px; background: rgba(20,18,14,0.78); }
    .name-tag.crowd { font-size: 12px; padding: 4px 10px; border-radius: 12px; }
    .panel {
      background: var(--bg);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.28);
    }
    #top {
      position: absolute; top: 12px; right: 12px; left: 12px;
      display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap;
    }
    #brand { padding: 10px 16px; min-width: 200px; }
    #brand h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0; }
    #brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    #brand .en { color: var(--gold); font-weight: 600; }
    #stats { padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; min-width: 110px; }
    #stats .n { font-size: 20px; color: var(--gold); font-weight: 800; }
    #stats .k { font-size: 12px; color: var(--muted); }
    #fpsMeter { font-size: 11px; color: var(--gold); margin-top: 2px; display: none; }
    #searchForm { display: flex; gap: 8px; flex: 1; min-width: 200px; padding: 8px; align-items: center; }
    #searchForm input, #seedInput {
      flex: 1; border: 0; background: rgba(255,255,255,0.1); color: var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: 15px; outline: none;
      direction: ltr; text-align: left; font-family: inherit;
    }
    #searchForm input::placeholder, #seedInput::placeholder { color: #b8a88a; }
    #searchForm button, .btn {
      border: 0; background: var(--gold); color: #2a1f0a; font-weight: 800;
      border-radius: 12px; padding: 10px 14px; cursor: pointer; font-size: 14px;
      font-family: inherit; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap; line-height: 1;
    }
    .btn.ghost, .btn.tool {
      background: var(--btn); color: var(--text);
      border: 1px solid rgba(232,196,90,0.28);
    }
    .btn.tool { min-height: 42px; padding: 8px 12px; }
    .btn .ico { font-size: 16px; line-height: 1; }
    .btn .sub { display: block; font-size: 11px; font-weight: 600; color: var(--gold); margin-top: 1px; }
    .btn.col { flex-direction: column; align-items: flex-start; gap: 0; }
    #foundMsg { position: absolute; top: 86px; right: 12px; padding: 8px 12px; font-size: 13px; max-width: min(90vw, 420px); }
    #levels {
      position: absolute; bottom: 36px; right: 12px; left: 12px;
      padding: 10px 14px 12px;
    }
    #levels .row { display: flex; align-items: center; gap: 12px; }
    #levelLabel { font-size: 13px; color: var(--gold); margin-bottom: 6px; font-weight: 700; }
    #levelSlider { flex: 1; accent-color: var(--gold); width: 100%; }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    #tools {
      display: grid;
      grid-template-columns: auto auto auto 1fr;
      gap: 8px;
      margin-top: 10px;
      align-items: stretch;
    }
    #seedWrap { display: flex; gap: 8px; align-items: center; min-width: 0; }
    #seedWrap label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    #seedInput { padding: 8px 10px; font-size: 13px; min-width: 0; }
    #attrib {
      position: absolute; bottom: 8px; left: 14px;
      font-size: 11px; color: rgba(255,255,255,0.85);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      pointer-events: none;
    }
    #levelBadge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -120%);
      padding: 10px 22px; font-size: 28px; font-weight: 800;
      letter-spacing: 0; border-radius: 18px; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
      background: rgba(18,16,14,0.78); border: 1px solid var(--gold);
    }
    @media (max-width: 720px) {
      #brand h1 { font-size: 18px; }
      #levelBadge { font-size: 22px; }
      #levels { bottom: 28px; padding: 10px 12px 12px; }
      #tools { grid-template-columns: 1fr 1fr 1fr; }
      #seedWrap { grid-column: 1 / -1; }
      #top { gap: 8px; }
      #stats { min-width: 90px; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="hud">
    <div id="top">
      <div id="brand" class="panel">
        <h1>دولة الأغنياء</h1>
        <p><span class="en">State of the Rich</span> — تجربة أولى</p>
      </div>
      <div id="stats" class="panel">
        <div class="n" id="residentsCount">١ ساكن</div>
        <div class="k" id="residentsHint">متابع واحد بهالتجربة</div>
        <div id="fpsMeter"></div>
      </div>
      <form id="searchForm" class="panel">
        <input id="search" type="search" placeholder="ابحث عن اسمك" autocomplete="off" enterkeyhint="search" />
        <button type="submit">بحث</button>
      </form>
    </div>
    <div id="foundMsg" class="panel" hidden></div>
    <div id="levelBadge" hidden></div>
    <div id="levels" class="panel">
      <div id="levelLabel">لفل 1</div>
      <div class="row" dir="ltr">
        <span>1</span>
        <input id="levelSlider" type="range" min="1" max="30" value="1" />
        <span>30</span>
      </div>
      <div class="hint">حرّك الشريط لتشوف كيف البيت بيتطور حسب نشاط المتابع. الأسماء بهالتجربة أمثلة.</div>
      <div id="tools">
        <button class="btn tool col" id="btnCamera" type="button" title="كاميرا">
          <span>الكاميرا</span>
          <span class="sub" id="camModeLabel">حرة</span>
        </button>
        <button class="btn tool col" id="btnSky" type="button" title="ليل ونهار">
          <span>الوقت</span>
          <span class="sub" id="skyModeLabel">تلقائي</span>
        </button>
        <button class="btn tool" id="btnOverview" type="button">الخريطة</button>
        <div id="seedWrap">
          <label for="seedInput">جرّب اسم</label>
          <input id="seedInput" type="text" value="" autocomplete="off" spellcheck="false" />
        </div>
      </div>
    </div>
    <div id="attrib" dir="ltr">© OpenStreetMap contributors · Land outline: EU-DEM / Copernicus</div>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
