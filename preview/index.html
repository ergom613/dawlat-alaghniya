<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <base href="https://ergom613.github.io/dawlat-alaghniya/preview/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>دولة الأغنياء — State of the Rich</title>
  <style>
    @font-face {
      font-family: Cairo;
      src: url("./assets/fonts/Cairo-Var.ttf") format("truetype");
      font-weight: 200 1000;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: rgba(16, 14, 12, 0.48);
      --bg2: rgba(18, 16, 13, 0.62);
      --line: rgba(232, 196, 90, 0.38);
      --gold: #e8c45a;
      --text: #fff6df;
      --muted: #d2c4a4;
      --btn: rgba(255, 255, 255, 0.08);
      --safe-top: max(10px, env(safe-area-inset-top, 0px));
      --safe-bottom: max(10px, env(safe-area-inset-bottom, 0px));
      --safe-left: max(10px, env(safe-area-inset-left, 0px));
      --safe-right: max(10px, env(safe-area-inset-right, 0px));
      --glass: blur(18px) saturate(1.25);
      --radius-pill: 999px;
      --btn-h: 44px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #8ec7e8;
      font-family: Cairo, "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, "Segoe UI", sans-serif;
      color: var(--text);
    }
    #c { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #hud * { pointer-events: auto; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
    .name-tag {
      position: absolute; left: 0; top: 0;
      transform: translate(-50%, -100%);
      background: rgba(20,18,14,0.88);
      border: 1px solid rgba(232,196,90,0.95);
      color: #fff6df;
      border-radius: 7px;
      padding: 1px 5px 1px;
      font-weight: 700;
      font-size: 8px;
      line-height: 1.2;
      white-space: nowrap;
      text-shadow: 0 1px 1px rgba(0,0,0,0.45);
      box-shadow: 0 2px 6px rgba(0,0,0,0.28);
      will-change: transform;
    }
    .name-tag strong { display: block; font-weight: 800; letter-spacing: 0; }
    .name-tag small { display: block; color: #e8c45a; font-weight: 600; font-size: 7px; margin-top: 0; }
    .name-tag.yacht { font-size: 8px; padding: 1px 5px; border-radius: 7px; }
    .name-tag.caption { transform: translate(-50%, 12%); font-size: 14px; background: rgba(20,18,14,0.78); }
    .name-tag.crowd { font-size: 12px; padding: 4px 10px; border-radius: 12px; }
    .name-tag.cele-badge {
      font-size: 13px; padding: 4px 9px 3px; border-radius: 12px;
      background: rgba(18,16,12,0.92); border: 1px solid #e8c45a; color: #fff6df;
      box-shadow: 0 0 14px rgba(232,196,90,0.55), 0 4px 10px rgba(0,0,0,0.35);
      z-index: 6;
    }
    .name-tag.cele-badge strong { font-size: 13px; font-weight: 800; color: #ffe08a; }
    .name-tag.cele-badge small { display: none; }

    .panel {
      background: var(--bg);
      border: 1px solid var(--line);
      backdrop-filter: var(--glass);
      -webkit-backdrop-filter: var(--glass);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
    }

    #top {
      position: absolute;
      top: var(--safe-top); right: var(--safe-right); left: var(--safe-left);
      display: flex; flex-direction: column; gap: 8px; align-items: stretch;
    }
    #topRow { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
    #followStrip { display: flex; align-items: center; flex: 0 0 auto; order: 9; }
    #followBtn { height: auto; min-height: 36px; align-self: stretch; padding: 0 12px; font-size: 13px; }
    #followPop {
      position: fixed; z-index: 70; top: calc(var(--safe-top) + 64px); left: 50%; transform: translateX(-50%);
      width: min(330px, calc(100vw - 24px)); padding: 12px 12px 14px; text-align: center;
    }
    #followPop[hidden] { display: none !important; }
    #followPop .followLine { margin: 0 22px 10px; font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.35; }
    #followClose {
      position: absolute; top: 6px; left: 6px; width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--text);
      font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit;
    }
    #followPop .stories {
      display: flex; justify-content: center; align-items: flex-start; gap: 16px;
    }
    #followPop .story {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      text-decoration: none; color: var(--text); width: 64px;
    }
    #followPop .ring {
      width: 56px; height: 56px; border-radius: 50%; padding: 3px;
      display: grid; place-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #followPop .story:hover .ring, #followPop .story:focus-visible .ring {
      transform: scale(1.08); box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    #followPop .av {
      width: 100%; height: 100%; border-radius: 50%;
      background: #111; display: grid; place-items: center;
      overflow: hidden; border: 2px solid rgba(16,14,12,0.85);
    }
    #followPop .av svg { width: 26px; height: 26px; display: block; }
    #followPop .story.tiktok .ring { background: linear-gradient(135deg, #25F4EE 0%, #000 48%, #FE2C55 100%); }
    #followPop .story.tiktok .av { background: #111; }
    #followPop .story.facebook .ring { background: #1877F2; }
    #followPop .story.facebook .av { background: #1877F2; border-color: #1877F2; }
    #followPop .story.instagram .ring {
      background: conic-gradient(from 200deg, #f58529, #dd2a7b, #8134af, #515bd4, #f58529);
    }
    #followPop .story.instagram .av {
      background: radial-gradient(circle at 30% 30%, #f58529, #dd2a7b 55%, #8134af);
      border-color: transparent;
    }
    #followPop .lab { font-size: 10px; font-weight: 700; color: var(--gold); line-height: 1.1; }
    #brand { padding: 8px 14px; min-width: 0; }
    #brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: 0; line-height: 1.2; }
    #brand p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
    #brand .en { color: var(--gold); font-weight: 600; }
    #stats { padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 92px; }
    #stats .n { font-size: 18px; color: var(--gold); font-weight: 800; line-height: 1.15; }
    #stats .k { font-size: 11px; color: var(--muted); }
    #fpsMeter { font-size: 11px; color: var(--gold); margin-top: 2px; display: none; }

    #searchForm {
      display: flex; gap: 6px; flex: 1; min-width: 0;
      padding: 6px; align-items: center;
    }
    #searchForm input, #seedInput {
      flex: 1 1 auto; min-width: 0; border: 0; background: rgba(255,255,255,0.10); color: var(--text);
      border-radius: var(--radius-pill); padding: 0 14px; height: var(--btn-h);
      font-size: 14px; outline: none; direction: ltr; text-align: left; font-family: inherit;
    }
    #searchForm input::placeholder, #seedInput::placeholder { color: #b8a88a; }

    .btn, #searchForm button {
      border: 1px solid var(--line);
      background: var(--btn);
      color: var(--text);
      font-weight: 700;
      border-radius: var(--radius-pill);
      height: var(--btn-h);
      min-width: var(--btn-h);
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      line-height: 1;
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease, color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #searchForm button { flex-shrink: 0; background: linear-gradient(180deg, #f0d36a, #d4a84a); color: #2a1f0a; border-color: transparent; font-weight: 800; }
    .btn:hover, #searchForm button:hover { border-color: var(--gold); background: rgba(232,196,90,0.18); }
    #searchForm button:hover { background: linear-gradient(180deg, #f6dc78, #e0b450); }
    .btn:active, #searchForm button:active { transform: scale(0.97); }
    .btn:focus-visible, #searchForm button:focus-visible, #searchForm input:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 2px;
    }
    .btn.primary, .btn.on {
      background: linear-gradient(180deg, #f0d36a, #d4a84a);
      color: #2a1f0a;
      border-color: transparent;
      font-weight: 800;
    }
    .btn.tool { padding: 0 12px; }
    .btn.icon { padding: 0; width: var(--btn-h); font-size: 18px; font-weight: 800; }
    .btn .ico { font-size: 16px; line-height: 1; }
    .btn .sub { font-size: 10px; font-weight: 700; color: var(--gold); line-height: 1; }
    .btn.col {
      flex-direction: column; align-items: center; gap: 2px;
      height: auto; min-height: var(--btn-h); padding: 6px 10px;
    }
    .btn.col .sub { margin: 0; }
    .btn.ghost { background: var(--btn); color: var(--text); }

    #foundMsg {
      position: absolute; top: calc(var(--safe-top) + 168px); right: var(--safe-right);
      padding: 8px 14px; font-size: 13px; max-width: min(90vw, 420px); z-index: 6;
    }
    #levelBadge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -120%);
      padding: 10px 22px; font-size: 28px; font-weight: 800;
      letter-spacing: 0; border-radius: 18px; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
      background: rgba(18,16,14,0.78); border: 1px solid var(--gold);
    }

    /* One bottom cluster: levels + owner tools + public wedding/sound. No overlaps. */
    #bottomStack {
      position: absolute;
      left: var(--safe-left); right: var(--safe-right); bottom: var(--safe-bottom);
      display: flex; flex-direction: column; align-items: stretch; gap: 8px;
      z-index: 6;
    }
    #dock { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
    .dock-row {
      display: flex; gap: 6px; align-items: center;
      justify-content: flex-start; flex-wrap: nowrap;
      min-height: var(--btn-h);
    }
    .dock-row .btn { flex: 0 0 auto; }
    .dock-row .track {
      flex: 1 1 auto; min-width: 0;
      font-size: 12px; font-weight: 700; color: var(--gold);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 6px;
    }
    #levelRow {
      display: flex; align-items: center; gap: 10px;
      padding: 2px 8px 0;
    }
    #levelLabel { font-size: 12px; color: var(--gold); font-weight: 700; white-space: nowrap; }
    #levelSlider { flex: 1; accent-color: var(--gold); width: 100%; height: 28px; }
    #levelRow .lo, #levelRow .hi { font-size: 11px; color: var(--muted); font-weight: 700; }
    #seedWrap { display: flex; gap: 6px; align-items: center; min-width: 0; flex: 1; }
    #seedWrap label { font-size: 11px; color: var(--muted); white-space: nowrap; }
    #seedInput { height: 36px; padding: 0 12px; font-size: 13px; max-width: 160px; }

    body:not(.owner-mode) .owner-only { display: none !important; }

    #ytWeddingWrap {
      width: 200px; height: 113px;
      border-radius: 14px; overflow: hidden;
      display: none;
      border: 1px solid var(--line);
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      align-self: flex-start;
    }
    #ytWeddingWrap.on { display: block; }
    #ytWeddingWrap iframe, #ytWedding { width: 200px; height: 113px; }

    #weddingBack {
      display: none;
      position: absolute;
      top: calc(var(--safe-top) + 8px);
      left: var(--safe-left);
      z-index: 7;
    }
    body.wedding-cam #weddingBack { display: inline-flex; }
    body.wedding-cam #top { padding-left: 92px; }

    #attrib {
      position: absolute;
      bottom: calc(var(--safe-bottom) + 2px);
      left: var(--safe-left);
      font-size: 10px; color: rgba(255,255,255,0.72);
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      pointer-events: none;
      z-index: 3;
      max-width: 46vw;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* Sit attribution above the dock by reserving space via padding on hud bottom — dock already covers it.
       Hide attrib on very small screens when dock is present. */
    #bottomStack ~ #attrib, #attrib { display: none; }

    #ownerPanel {
      display: none;
      padding: 12px 14px 14px;
      max-height: min(58vh, 520px);
      overflow: auto;
    }
    #ownerPanel.open { display: block; }
    #ownerPanel h2 { margin: 0 0 8px; font-size: 16px; color: var(--gold); font-weight: 800; }
    #ownerPanel label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; font-weight: 700; }
    #ownerPanel input[type="text"], #ownerPanel input[type="password"], #ownerPanel input[type="number"] {
      width: 100%; border: 0; background: rgba(255,255,255,0.10); color: var(--text);
      border-radius: var(--radius-pill); padding: 0 14px; height: var(--btn-h);
      font-size: 14px; outline: none; font-family: inherit;
    }
    #ownerPanel .row2 { display: flex; gap: 10px; }
    #ownerPanel .row2 > div { flex: 1; }
    #ownerPanel .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    #ownerMsg { font-size: 13px; margin-top: 8px; color: var(--muted); min-height: 1.2em; }
    #ownerMsg.ok { color: #9ee6a0; }
    #ownerMsg.err { color: #ffb4a8; }
    #ownerTokenBox p { margin: 0 0 8px; font-size: 13px; color: var(--text); line-height: 1.45; }


    #meteorBanner {
      position: fixed;
      left: 50%;
      top: 6.5%;
      transform: translateX(-50%);
      z-index: 30;
      pointer-events: none;
      text-align: center;
      max-width: 94vw;
      width: max-content;
      padding: 12px 22px 14px;
      border-radius: 22px;
      background: rgba(12, 8, 4, 0.72);
      border: 2px solid rgba(232, 196, 90, 0.85);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45), 0 0 30px rgba(255,120,30,0.25);
      direction: rtl;
      font-family: Cairo, "Noto Naskh Arabic", "Noto Sans Arabic", Tahoma, sans-serif;
      font-weight: 800;
      font-size: clamp(26px, 5.6vw, 60px);
      line-height: 1.35;
      color: #fff6df;
      -webkit-text-stroke: 0.4px rgba(20,10,0,0.35);
      text-shadow: 0 2px 0 #2a1a00, 0 0 22px rgba(255,110,30,0.9), 0 8px 18px rgba(0,0,0,0.7);
      letter-spacing: 0;
    }
    #meteorBanner[hidden] { display: none !important; }
    #meteorBanner .meteorLine { display: block; white-space: nowrap; }
    #meteorBanner .meteorSub { font-size: 0.78em; margin-top: 0.15em; }
    #meteorBanner .meteorName {
      display: inline-block;
      color: #ffe08a;
      unicode-bidi: isolate;
    }
    #meteorBanner.rebuild {
      text-shadow: 0 2px 0 #1a2a10, 0 0 28px rgba(180,255,120,0.75), 0 8px 22px rgba(0,0,0,0.7);
    }

    @media (max-width: 720px) {
      :root { --btn-h: 42px; }
      #brand { padding: 7px 12px; flex: 1 1 auto; }
      #brand h1 { font-size: 17px; }
      #stats { min-width: 72px; padding: 7px 10px; }
      #stats .n { font-size: 16px; }
      #searchForm { flex: 1 1 100%; width: 100%; padding: 5px; }
      #searchForm { flex: 1 1 60%; width: auto; }
      #followBtn { padding: 0 10px; font-size: 12px; }
      #searchForm input { font-size: 14px; }
      #foundMsg { top: calc(var(--safe-top) + 210px); }
      #followPop .followLine { font-size: 12px; }
      #followPop .ring { width: 48px; height: 48px; }
      #followPop .story { width: 56px; gap: 3px; }
      #followPop .stories { gap: 12px; }
      #followPop .av svg { width: 22px; height: 22px; }
      #levelBadge { font-size: 22px; }
      #ownerDock { overflow: visible; flex-wrap: nowrap; }
      #ownerDock .btn { flex: 1 1 0; min-width: 0; padding: 6px 4px; font-size: 11px; }
      #seedWrap { display: none; }
      #ytWeddingWrap { transform: scale(0.86); transform-origin: bottom right; }
    }
    #searchForm { position: relative; }
    #searchSuggest {
      position: absolute; top: calc(100% + 6px); right: 0; left: 0; z-index: 80; padding: 6px;
      max-height: min(52vh, 380px); overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    #searchSuggest[hidden] { display: none !important; }
    #searchSuggest .sg {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
      border: 0; border-radius: 14px; background: rgba(255,255,255,0.06); color: var(--text);
      padding: 9px 12px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; text-align: right;
    }
    #searchSuggest .sg small { color: var(--gold); font-weight: 700; font-size: 11px; white-space: nowrap; }
    #searchSuggest .sg bdi { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
    #searchSuggest .sg.on, #searchSuggest .sg:hover { background: rgba(232,196,90,0.22); }
    #searchSuggest .sg-none { padding: 10px; color: var(--muted); font-size: 13px; text-align: center; }
    #houseCard {
      position: fixed; z-index: 75; left: 50%; transform: translateX(-50%);
      bottom: calc(var(--safe-bottom, 10px) + 96px); width: min(340px, calc(100vw - 24px));
      padding: 12px 14px 14px; text-align: center; border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(232,196,90,0.35), 0 10px 28px rgba(0,0,0,0.4);
    }
    #houseCard[hidden] { display: none !important; }
    #houseCard .hc-kicker { font-size: 12px; color: var(--gold); font-weight: 800; }
    #houseCard .hc-name { font-size: 20px; font-weight: 800; margin: 2px 26px 4px; direction: ltr; unicode-bidi: plaintext; overflow-wrap: anywhere; }
    #houseCard .hc-meta { display: flex; gap: 10px; justify-content: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; }
    #houseCard .hc-meta span { background: rgba(255,255,255,0.08); border-radius: 999px; padding: 3px 10px; }
    #houseCard #houseCardShare { width: 100%; }
    #houseCardClose {
      position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: var(--text); cursor: pointer; font-family: inherit;
    }
    #shareToast { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); top: calc(var(--safe-top) + 120px); padding: 10px 16px; font-weight: 800; }
    #shareToast[hidden] { display: none !important; }
    .name-tag.picked { background: linear-gradient(180deg, #f0d36a, #d4a84a) !important; color: #2a1f0a !important; border: 2px solid #fff6d0 !important; box-shadow: 0 0 18px rgba(240,211,106,0.85), 0 4px 12px rgba(0,0,0,0.4) !important; z-index: 8; transform-origin: 50% 100%; }
    .name-tag.picked strong { font-size: 16px; }
    .name-tag.picked small { color: #4a3510 !important; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="hud">
    <div id="top">
      <div id="topRow">
        <div id="brand" class="panel">
          <h1>دولة الأغنياء</h1>
          <p><span class="en">State of the Rich</span> — تجربة أولى</p>
        </div>
        <div id="stats" class="panel">
          <div class="n" id="residentsCount">…</div>
          <div class="k" id="residentsHint">عم نعدّ السكان</div>
          <div id="fpsMeter"></div>
        </div>
        <div id="followStrip">
          <button id="followBtn" class="btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="followPop">👥 تابعونا</button>
        </div>
        <form id="searchForm" class="panel">
          <input id="search" type="search" placeholder="🔍 دوّر على بيتك: اسمك أو رقم بيتك" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-autocomplete="list" aria-controls="searchSuggest" />
          <button type="submit">دوّر</button>
          <div id="searchSuggest" class="panel" role="listbox" hidden></div>
        </form>
      </div>
    </div>
    <div id="foundMsg" class="panel" hidden></div>
    <div id="levelBadge" hidden></div>
    <button class="btn" id="weddingBack" type="button">رجوع</button>

    <div id="bottomStack">
      <div id="ytWeddingWrap" aria-hidden="true"><div id="ytWedding"></div></div>
      <div id="dock" class="panel">
        <div id="levelRow" class="owner-only">
          <div id="levelLabel">لفل 1</div>
          <span class="lo">1</span>
          <input id="levelSlider" type="range" min="1" max="30" value="1" />
          <span class="hi">30</span>
          <div id="seedWrap" class="owner-only">
            <label for="seedInput">جرّب اسم</label>
            <input id="seedInput" type="text" value="" autocomplete="off" spellcheck="false" />
          </div>
        </div>
        <div id="ownerDock" class="dock-row owner-only">
          <button class="btn tool col" id="btnCamera" type="button" title="كاميرا">
            <span>📷 كاميرا</span>
            <span class="sub" id="camModeLabel">حرة</span>
          </button>
          <button class="btn tool col" id="btnSky" type="button" title="ليل ونهار">
            <span>🕐 الوقت</span>
            <span class="sub" id="skyModeLabel">تلقائي</span>
          </button>

  <script>
    (function () {
      function arNum(n) { return String(n).replace(/[0-9]/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; }); }
      function sakinWord(n) {
        if (n === 1) return 'ساكن';
        if (n === 2) return 'ساكنان';
        if (n >= 3 && n <= 10) return 'سكان';
        return 'ساكن';
      }
      fetch('./data/residents.json').then(function (r) { return r.json(); }).then(function (d) {
        var n = (d && d.residents) ? d.residents.length : 0;
        if (!n) return;
        var w = sakinWord(n);
        var c = document.getElementById('residentsCount');
        var h = document.getElementById('residentsHint');
        if (c) c.textContent = arNum(n) + ' ' + w;
        if (h) h.textContent = 'صرنا ' + arNum(n) + ' ' + w + ' وعم نكبر 🏗️';
      }).catch(function () {});
    })();
  </script>

  <script>
    (function () {
      var btn = document.getElementById('followBtn');
      var pop = document.getElementById('followPop');
      var x = document.getElementById('followClose');
      if (!btn || !pop) return;
      function set(open) { pop.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false'); btn.classList.toggle('on', open); }
      btn.addEventListener('click', function (e) { e.stopPropagation(); set(pop.hidden); });
      if (x) x.addEventListener('click', function () { set(false); });
      pop.addEventListener('click', function (e) { e.stopPropagation(); });
      document.addEventListener('pointerdown', function (e) { if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) set(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
    })();
  </script>
